# INVERTIBILITY TEST for the decoder-less Stage-0 3-band depth-JEPA fusion (k7).
# k7 analog of invert-stage0-bandjepa-k23.yaml; only combine.layers, out_dir and the
# wandb name differ. Freeze the Stage-0 combine (via env STAGE0_COMBINE) and train ONLY
# the decoder (L1+LPIPS+GAN). No semantic_rent (legacy decoder path). Compare val
# PSNR/rFID to decide if the pure-band k7 latent is invertible.
#
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 WANDB_MODE=offline \
#   STAGE0_COMBINE=/sensei-fs-3/users/hongyangd/ckpt/stage0-bandjepa-depthattn-k7/ckpt_latest.pt \
#   DINOV3_REPO_DIR=$PWD/../../dinov3_repo \
#   DINOV3_CKPT_DIR=/sensei-fs-3/users/hongyangd/pretrained_models/encoders/dinov3 \
#   torchrun --nproc_per_node=8 src/train_decoder.py \
#       --config configs/stage1/decoder/invert-stage0-bandjepa-k7.yaml
#
# combine params MUST match the k7 Stage-0 run (strict load of _ck0["combine"]).
combine:
  target: stage1.combine.DepthAttnCombine
  params:
    layers: [11, 13, 15, 17, 19, 21, 23]
    p_drop: 0.5              # frozen fusion still samples masks in train mode (matches joint)
    full_frac: 0.3333333
    uniform_frac: 0.3333333
    cls_surrogate: true      # must match Stage-0 (defines the latent)
    dim: 1024
    out_dim: 1024
    n_layers: 2
    n_heads: 8
    mlp_mult: 2
    attn_kind: softmax
decoder:
  config_path: configs/decoder/ViTXL
  latent_dim: 1024
loss:
  lpips_w: 1.0
  sigreg: null
  gan:
    disc_weight: 0.75
    disc_start: 8            # same as the joint ganfusion recipe
semantic_rent: null          # <-- pure decoder-only on a FROZEN fusion (no rent)
data:
  data_dir: /mnt/localssd/imagenet-256
  image_size: 256
  val_npz: data_eval/imagenet-256-val.npz
  val_n: 100                 # match the joint run's val_n for comparable PSNR
training:
  epochs: 16
  batch_size: 32
  lr: 2.0e-4
  warmup_epochs: 2
  ema_decay: 0.9995
  precision: bf16
  ckpt_every: 1
  log_every: 50
  seed: 42
  out_dir: /sensei-fs-3/users/hongyangd/ckpt/invert-stage0-bandjepa-k7
probe:
  loo_solo: final
  val_image: assets/samples/sample_1.png
wandb:
  enabled: true
  project: LeRAE
  entity: uscgvl
  name: invert-stage0-bandjepa-k7
