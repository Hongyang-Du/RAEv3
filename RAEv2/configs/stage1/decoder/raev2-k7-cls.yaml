# raev2 K=7 FIXED mean + cls ON, 5 epochs, GAN from epoch 2, lr 8e-4.
# Same recipe as raev2-k23-cls / ours cls-on 5ep; only the trained layer set is
# the 7-layer subset [11,13,..,23]. Baseline for the cls-surrogate section.
combine:
  target: stage1.combine.MLSCombine
  params:
    layers: [11, 13, 15, 17, 19, 21, 23]
    weighting: mean
    p_drop: 0.0
    cls_surrogate: true
    projector: none
    dim: 1024
    out_dim: 1024
decoder:
  config_path: configs/decoder/ViTXL
  latent_dim: 1024
loss:
  lpips_w: 1.0
  sigreg: null
  gan:
    disc_weight: 0.75
    disc_start: 2
data:
  data_dir: /datasets/imagenet-256-full
  image_size: 256
  val_npz: data_eval/imagenet-256-val.npz
  val_n: 100
training:
  epochs: 5
  batch_size: 32
  lr: 8.0e-4
  warmup_epochs: 2
  ema_decay: 0.9995
  precision: bf16
  ckpt_every: 1
  log_every: 50
  seed: 42
  out_dir: output_full/decoder_raev2_k7_cls_5ep
probe:
  loo_solo: final
  val_image: assets/samples/sample_1.png
wandb:
  enabled: true
  project: raev3-full
  entity: uscgvl
  name: decoder-raev2-k7-cls-5ep
