# Fine-tune OmniRAE (cls-on random-drop k23) to ALIGN with the k7 feed condition:
# fix the combine to mean over the 7 k7 layers + cls, warm-start from ours, 1 epoch,
# small batch, low lr, GAN from step 0 (disc also warm-started). Goal: close the
# cross-decode gFID gap to the native k7 decoder on the official k7-DiT latents.
combine:
  target: stage1.combine.MLSCombine
  params:
    layers: [11, 13, 15, 17, 19, 21, 23]
    weighting: mean
    p_drop: 0.0
    cls_surrogate: true
    projector: none
    dim: 1024
    out_dim: 1024
decoder:
  config_path: configs/decoder/ViTXL
  latent_dim: 1024
loss:
  lpips_w: 1.0
  sigreg: null
  gan:
    disc_weight: 0.75
    disc_start: 0
data:
  data_dir: /datasets/imagenet-256-full
  image_size: 256
  val_npz: data_eval/imagenet-256-val.npz
  val_n: 100
training:
  epochs: 1
  batch_size: 16
  lr: 1.0e-4
  warmup_epochs: 0
  ema_decay: 0.9995
  precision: bf16
  ckpt_every: 1
  log_every: 50
  seed: 42
  out_dir: output_full/decoder_ft_omnirae_k7
  init_from: output_full/decoder_random_drop_layer_mls_plain_cls_k23_16ep/ckpt_ep016.pt
probe:
  loo_solo: final
  val_image: assets/samples/sample_1.png
wandb:
  enabled: true
  project: raev3-full
  entity: uscgvl
  name: ft-omnirae-k7-1ep
