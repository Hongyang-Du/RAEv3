# k=7 ORIGINAL decoder baseline: raev2-style equal-weight mean over the raev2
# DEFAULT K=7 layers (RAEV2_LAYERS = [11,13,15,17,19,21,23]), fed straight to the
# decoder. No drop, no projector, no SIGReg -- a decoder trained specifically for
# the standard 7-layer budget. Compared against the k=23 random-drop+SIGReg decoder
# evaluated on these same 7 layers (configs/.../infer-k23-fed-k7.yaml).
combine:
  target: stage1.combine.MLSCombine
  params:
    layers: [11, 13, 15, 17, 19, 21, 23]
    weighting: mean
    p_drop: 0.0
    p_full: 0.0
    cls_surrogate: false
    projector: none
    dim: 1024
    out_dim: 1024
decoder:
  config_path: configs/decoder/ViTXL
  latent_dim: 1024
loss:
  lpips_w: 1.0
  sigreg: null
  gan:
    disc_weight: 0.75
    disc_start: 1
data:
  data_dir: /datasets/imagenet-256-full
  image_size: 256
  val_npz: data_eval/imagenet-256-val.npz
  val_n: 100
training:
  epochs: 5
  batch_size: 32
  lr: 8.0e-4
  warmup_epochs: 2
  ema_decay: 0.9995
  precision: bf16
  ckpt_every: 1
  log_every: 50
  seed: 42
  out_dir: output_full/decoder_raev2_k7
probe:
  loo_solo: 'off'
  val_image: assets/samples/sample_1.png
wandb:
  enabled: true
  project: raev3-full
  entity: uscgvl
  name: decoder-raev2-k7
