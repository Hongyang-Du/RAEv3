# Stage-0 MAE denoising-AE feature-fusion (k7), UNCOMPRESSED baseline (d==dim=1024).
# Sanity check that the denoise-AE pipeline itself works before testing compression:
# reconstruct the FULL-layer pool from a layer-dropout-corrupted pool, no bottleneck.
# D_mae is throwaway; only E is kept for Stage-1/DiT. See src/train_mae_denoise.py.
#
#   bash run_denoise_ae.sh mae configs/stage0/mae-denoise-k7-d1024.yaml
encoder:
  layers: [11, 13, 15, 17, 19, 21, 23]
  dim: 1024
  d: 1024                   # NO compression (d==dim): the uncompressed baseline
  depth: 6
  n_heads: 8
  mlp_mult: 4
  proj: linear
decoder:
  depth: 6
  n_heads: 8
  mlp_mult: 4
sigreg:
  distributed: true
  scale_by_n: true
data:
  data_dir: /mnt/localssd/imagenet-256
  image_size: 256
  num_workers: 8
training:
  epochs: 5
  batch_size: 64
  lr: 2.0e-4
  warmup_epochs: 1
  precision: bf16
  ckpt_every: 1
  log_every: 50
  seed: 42
  p_drop: 0.5
  full_frac: 0.15
  uniform_frac: 0.0
  cls_surrogate: true
  w_recon: 1.0
  w_sig: 0.02
  out_dir: /sensei-fs-3/users/hongyangd/ckpt/stage0-mae-denoise-k7-d1024
wandb:
  enabled: true
  project: LeRAE
  entity: uscgvl
  name: stage0-mae-denoise-k7-d1024
