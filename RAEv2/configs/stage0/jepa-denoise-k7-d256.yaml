# Stage-0 JEPA denoising-AE feature-fusion (k7), decoupled from the decoder.
# Mutual-information flavor: both the dropped and the full pool go through the SAME
# bottleneck encoder E (dim 1024 -> d 256); the predictor (no mask / no KV) bridges the
# two compressed views. Per-view SIGReg pins BOTH z_ctx and z_full to N(0,I) in the
# d-dim bottleneck -- the right-side (z_full) SIGReg is what lets the live target skip
# EMA/stop-grad without collapsing. predictor + grounding are throwaway; only E is kept
# for Stage-1/DiT. cls_surrogate=false. full_frac is FORCED to 0 (ctx = pure subset).
# See src/train_jepa_denoise.py.
#
#   bash run_denoise_ae.sh jepa configs/stage0/jepa-denoise-k7-d256.yaml
encoder:
  layers: [11, 13, 15, 17, 19, 21, 23]
  dim: 1024
  d: 256                    # bottleneck width; sweep down to 16 (64x) once the pipe is confirmed
  depth: 6
  n_heads: 8
  mlp_mult: 4
  proj: mlp                 # nonlinear projector (JEPA/SSL convention)
predictor:
  depth: 2                  # throwaway; operates in the d-dim bottleneck (no mask / no KV)
  n_heads: 8
  mlp_mult: 2
sigreg:
  distributed: true
  scale_by_n: true
data:
  data_dir: /mnt/localssd/imagenet-256
  image_size: 256
  num_workers: 8
training:
  epochs: 10
  batch_size: 64
  lr: 2.0e-4
  warmup_epochs: 1
  precision: bf16
  ckpt_every: 1
  log_every: 50
  seed: 42
  p_drop: 0.5               # K=7 -> ~3.5 kept in the ctx subset
  uniform_frac: 0.0
  cls_surrogate: true
  detach_target: false      # LeJEPA live target (right-side SIGReg holds it); set true only if it can't
  w_pred: 1.0
  w_sig: 0.02               # LeJEPA lambda (transfers across batch via scale_by_n)
  w_gnd: 1.0                # semantic anti-collapse insurance; ablate to 0 to test SIGReg-alone
  out_dir: /sensei-fs-3/users/hongyangd/ckpt/stage0-jepa-denoise-k7-d256
wandb:
  enabled: true
  project: LeRAE
  entity: uscgvl
  name: stage0-jepa-denoise-k7-d256
