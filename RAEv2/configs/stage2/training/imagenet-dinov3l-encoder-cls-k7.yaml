# EXP-6: k7 counterpart of EXP-3. Stage-2 DiT that diffuses the ENCODER-side combine latent
# (1024-dim), CLS ON (cls_surrogate: true), using ONLY 7 layers [11,13,15,17,19,21,23] of the
# shared k23 random-drop decoder (random-drop training handles the 7-layer subset).
# Identical to imagenet-dinov3l-encoder-cls-k23.yaml except: encoder_name layers, combine layers,
# and the latent normalization stats (must be the k7 stats).
#
# Needs k7 latent normalization stats (mean/var of the 7-layer clean mean+cls combine latent):
#   compute once with scripts/stage1/compute_latent_stats.py --config <this> -> latent_stats_k7.pt
stage_1:
  target: stage1.RAECombine
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    stage1_ckpt_path: /sensei-fs-3/users/hongyangd/ckpt/omni-randomdrop-plain-k23-nano/ckpt_ep016.pt   # train_decoder fmt (ImageNet-normed output) -> RAECombine.decode de-norm is correct
    use_ema: false
    latent_dim: 1024
    normalization_stat_path: /sensei-fs-3/users/hongyangd/RAEv3/RAEv2/latent_stats/latent_stats_k7_perpos.pt
    drop: false        # DiT trains on the CLEAN mean+cls latent (no per-step layer-drop) -> matches official
    combine_config:
      target: stage1.combine.MLSCombine
      params:
        layers: [11, 13, 15, 17, 19, 21, 23]
        weighting: random_drop
        p_drop: 0.3
        p_full: 0.0
        cls_surrogate: true        # cls ON
        projector: none
        dim: 1024
        out_dim: 1024
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size:
    - 1
    - 1
    in_channels: 1024          # encoder combine latent
    hidden_size:
    - 1440
    - 2048
    depth:
    - 28
    - 2
    num_heads:
    - 20
    - 16
    mlp_ratio: 4.0
    base_model_depth: 8
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
dataset:
  target: imagenet
  type: hf
  data_dir: /mnt/localssd/imagenet-256
  split: train
  condition_type: label
  shared_tmpdir: ~/tmp
training:
  epochs: 80
  global_batch_size: 1024
  grad_accum_steps: 2          # 64/GPU on 8x80GB (128/GPU OOMs); keeps global batch 1024
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 2         # save every 2 epochs (resume granularity); retention bounds disk
  sample_every: 5000
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.0002
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 25
    decay_end_epoch: 50
    base_lr: 0.0002
    final_lr: 2.0e-05
    warmup_from_zero: false
  image_size: 256
# eval disabled during training (no val split downloaded; gFID is a separate offline step).
eval: null
misc:
  latent_size:
  - 1024
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 262144   # 256 * 1024
  time_dist_shift_base: 4096
