# ABLATION (DiT-B, 40 epochs). Stage-2 DiT on the OFFICIAL RAEv2 k7 decoder latent.
# 5th point of the abl-dit-b-* decoder comparison: same DiT-B budget + training schedule
# as imagenet-dinov3l-alignmean-cls-depthattn-k7-ablB.yaml, but stage_1 is the OFFICIAL
# published RAEv2 k7 decoder (stage1.RAE, decoder.pt + stats.pt) rather than one of our
# retrained depth-attn / jepa decoders. stage1.RAE reads normalization from stats.pt, so
# NO separate latent_stats precompute is needed.
stage_1:
  target: stage1.RAE
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    pretrained_decoder_path: pretrained_models/stage1/imagenet/dinov3l-k7/decoder.pt
    noise_tau: 0.0
    normalization_stat_path: pretrained_models/stage1/imagenet/dinov3l-k7/stats.pt
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size:
    - 1
    - 1
    in_channels: 1024
    hidden_size:                # DiT-B ablation body [enc, wide 2-block head]
    - 768
    - 1024
    depth:
    - 12
    - 2
    num_heads:
    - 12
    - 16
    mlp_ratio: 4.0
    base_model_depth: 4
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
dataset:
  target: imagenet
  type: hf
  data_dir: /mnt/localssd/imagenet-256
  split: train
  condition_type: label
  shared_tmpdir: ~/tmp
training:
  epochs: 40
  global_batch_size: 2048
  grad_accum_steps: 2
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 2
  sample_every: 5000
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.0002
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 6
    decay_end_epoch: 13
    base_lr: 0.0002
    final_lr: 2.0e-04   # no LR decay: final == base -> constant 2e-4 after warmup
    warmup_from_zero: false
  image_size: 256
misc:
  latent_size:
  - 1024
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
