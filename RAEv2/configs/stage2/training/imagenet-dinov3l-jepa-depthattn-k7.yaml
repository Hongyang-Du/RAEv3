# Stage-2 DiT on the FROZEN Stage-0 JEPA k7 latent (ckpt/stage0-fusion-jepa-depthattn-k7).
# On-the-fly encode: stage_1=RAECombine loads ONLY the combine (use_ema:false -> ck['combine']);
# the stage-0 ckpt has no decoder, so decoder weights are skipped (rae_variants guard) and
# sample-viz is disabled (sample_every huge) + eval:null -> decoder is never called. drop:false
# -> full-feed latent (== the JEPA z_full target). Latent is ~N(0,I) (SIGReg), verified
# mean -0.003/std 0.999, so normalization_stat_path:null. Train-only; gFID later via the
# Stage-1 decoder (jepa-k7-stage1-decoder-oldnorm.yaml).
stage_1:
  target: stage1.RAECombine
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    stage1_ckpt_path: /sensei-fs-3/users/hongyangd/ckpt/stage0-fusion-jepa-depthattn-k7/ckpt_latest.pt
    use_ema: false
    latent_dim: 1024
    normalization_stat_path: null   # JEPA latent ~N(0,I) via SIGReg; compute stats if training unstable
    drop: false
    combine_config:
      target: stage1.combine.DepthAttnCombine
      params:
        layers: [11, 13, 15, 17, 19, 21, 23]
        p_drop: 0.3
        full_frac: 0.3333333
        uniform_frac: 0.3333333
        cls_surrogate: false
        dim: 1024
        out_dim: 1024
        n_layers: 2
        n_heads: 8
        mlp_mult: 2
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size:
    - 1
    - 1
    in_channels: 1024
    hidden_size:
    - 1440
    - 2048
    depth:
    - 28
    - 2
    num_heads:
    - 20
    - 16
    mlp_ratio: 4.0
    base_model_depth: 8
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
dataset:
  target: imagenet
  type: hf
  data_dir: ./data/imagenet-256
  split: train
  condition_type: label
  shared_tmpdir: ~/tmp
training:
  epochs: 80
  global_batch_size: 1024
  grad_accum_steps: 2
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 2
  sample_every: 999999999   # viz OFF: stage-0 ckpt has no decoder, cannot decode samples
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.0002
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 25
    decay_end_epoch: 50
    base_lr: 0.0002
    final_lr: 2.0e-05
    warmup_from_zero: false
  image_size: 256
eval: null
misc:
  latent_size:
  - 1024
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
