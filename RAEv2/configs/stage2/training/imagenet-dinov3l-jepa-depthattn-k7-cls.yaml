# Stage-2 DiT on the CLS-ON JEPA k7 latent that ckpt/stage1-decoder-jepa-depthattn-k7-cls
# was trained to invert. That decoder = ViT-XL on top of the FROZEN Stage-0 JEPA k7 fusion
# (ckpt/stage0-fusion-jepa-depthattn-k7) with cls_surrogate:true (non-param forward-additive
# L23 token-mean). So the DiT MUST encode the SAME latent: cls_surrogate:true, attn_kind:softmax,
# frozen combine == the stage-0 fusion weights (ema_combine == combine, combine was frozen).
#
# stage1_ckpt_path -> the DECODER ckpt (has combine + decoder + ema_*), use_ema:true so viz/gFID
# can decode (ema_dec). drop:false -> full-feed latent (combine.eval(), all-ones mask, cls added
# deterministically); p_drop irrelevant. cls_surrogate shifts the latent off N(0,I) ->
# normalization_stat_path MUST point at latent_stats.pt (run run_jepa_k7_cls_stats.sh ONCE first).
stage_1:
  target: stage1.RAECombine
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    stage1_ckpt_path: /sensei-fs-3/users/hongyangd/ckpt/stage1-decoder-jepa-depthattn-k7-cls/ckpt_latest.pt
    use_ema: true
    latent_dim: 1024
    normalization_stat_path: /sensei-fs-3/users/hongyangd/ckpt/stage1-decoder-jepa-depthattn-k7-cls/latent_stats.pt
    drop: false
    combine_config:
      target: stage1.combine.DepthAttnCombine
      params:
        layers: [11, 13, 15, 17, 19, 21, 23]
        p_drop: 0               # irrelevant under drop:false (combine forced to eval, full mask)
        cls_surrogate: true     # MUST match the decoder (defines the latent)
        dim: 1024
        out_dim: 1024
        n_layers: 2
        n_heads: 8
        mlp_mult: 2
        attn_kind: softmax      # matches the k7-cls decoder combine (in_proj_weight == nn.MultiheadAttention)
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size:
    - 1
    - 1
    in_channels: 1024
    hidden_size:
    - 1440
    - 2048
    depth:
    - 28
    - 2
    num_heads:
    - 20
    - 16
    mlp_ratio: 4.0
    base_model_depth: 8
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
dataset:
  target: imagenet
  type: hf
  data_dir: ./data/imagenet-256
  split: train
  condition_type: label
  shared_tmpdir: ~/tmp
training:
  epochs: 80
  global_batch_size: 1024
  grad_accum_steps: 2
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 2
  sample_every: 5000          # viz ON: the k7-cls decoder is loaded (ema_dec) -> samples decode
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.0002
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 25
    decay_end_epoch: 50
    base_lr: 0.0002
    final_lr: 2.0e-05
    warmup_from_zero: false
  image_size: 256
eval: null
misc:
  latent_size:
  - 1024
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
