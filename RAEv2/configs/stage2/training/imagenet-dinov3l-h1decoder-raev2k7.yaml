# k7 RAEv2 h1-DiT: identical to imagenet-dinov3l-h1decoder-raev2k23.yaml EXCEPT the stage-1
# decoder is the OFFICIAL RAEv2 k7 decoder (nyu-visionx/RAEv2-models, dinov3l-k7) instead of
# our k23 repro. k7 = dinov3 layers [11,13,15,17,19,21,23]. native_encode + output_01 as raev2k23
# (validated: official k7 decoder round-trips 21.1 dB through this pipeline with RAW native z0;
# applying stats.pt on top is WORSE 18.2 dB, so no separate latent-stats normalization).
#
# The official decoder.pt is a RAW state_dict; wrapped to {'decoder': sd, 'combine': {}} at
#   /sensei-fs-3/users/hongyangd/ckpt/official-k7-decoder/decoder_wrapped.pt
#
# Before training: compute per-position h1 stats once ->
#   torchrun --nproc_per_node=1 src/compute_h1_stats_perpos.py --config <this> \
#       --num-samples 50000 --batch 128 \
#       --out latent_stats/h1_stats_raev2k7_official_native_perpos.pt
stage_1:
  target: stage1.rae_decoder_h1.RAEDecoderH1
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    stage1_ckpt_path: /sensei-fs-3/users/hongyangd/ckpt/official-k7-decoder/decoder_wrapped.pt
    use_ema: false
    output_01: true
    native_encode: true
    latent_dim: 1024
    drop: false
    h1_stats_path: /sensei-fs-3/users/hongyangd/RAEv3/RAEv2/latent_stats/h1_stats_raev2k7_official_native_perpos.pt
    combine_config:
      target: stage1.combine.MLSCombine
      params:
        layers: [11, 13, 15, 17, 19, 21, 23]
        weighting: mean
        p_drop: 0.0
        p_full: 0.0
        cls_surrogate: True
        projector: none
        dim: 1024
        out_dim: 1024
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size:
    - 1
    - 1
    in_channels: 1152          # decoder_hidden_size (h1) for ViT-XL
    hidden_size:
    - 1440
    - 2048
    depth:
    - 28
    - 2
    num_heads:
    - 20
    - 16
    mlp_ratio: 4.0
    base_model_depth: 8
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
dataset:
  target: imagenet
  type: hf
  data_dir: /mnt/localssd/imagenet-256
  split: train
  condition_type: label
  shared_tmpdir: ~/tmp
training:
  epochs: 83
  global_batch_size: 1024
  grad_accum_steps: 2
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 2
  sample_every: 5000
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.0002
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 25
    decay_end_epoch: 50
    base_lr: 0.0002
    final_lr: 2.0e-05
    warmup_from_zero: false
  image_size: 256
eval: null
misc:
  latent_size:
  - 1152
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 294912
  time_dist_shift_base: 4096
