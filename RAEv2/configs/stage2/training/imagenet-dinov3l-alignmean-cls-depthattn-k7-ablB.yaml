# ABLATION (DiT-B, 20 epochs). Stage-2 DiT on the ALIGN-TO-(mean+cls) k7 depth-attn
# latent that ckpt/alignmean-cls-k7-depthattn inverts. Same latent contract as
# imagenet-dinov3l-alignmean-cls-depthattn-k7.yaml (cls_surrogate:true, softmax,
# use_ema:true, drop:false full-feed); only the stage-2 DiT is shrunk to DiT-B and
# trained 20ep. latent_stats.pt already exists for this decoder.
# NOTE: stage1_ckpt is ckpt_ep016.pt (ckpt_latest.pt was cleaned up; ep016 = final).
stage_1:
  target: stage1.RAECombine
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    stage1_ckpt_path: /sensei-fs-3/users/hongyangd/ckpt/alignmean-cls-k7-depthattn/ckpt_ep016.pt
    use_ema: true
    latent_dim: 1024
    normalization_stat_path: /sensei-fs-3/users/hongyangd/ckpt/alignmean-cls-k7-depthattn/latent_stats.pt
    drop: false
    combine_config:
      target: stage1.combine.DepthAttnCombine
      params:
        layers: [11, 13, 15, 17, 19, 21, 23]
        p_drop: 0               # irrelevant under drop:false (combine forced to eval, full mask)
        cls_surrogate: true     # MUST match the decoder (defines the latent)
        dim: 1024
        out_dim: 1024
        n_layers: 2
        n_heads: 8
        mlp_mult: 2
        attn_kind: softmax      # matches the trained decoder combine (DepthAttnCombine default)
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size:
    - 1
    - 1
    in_channels: 1024
    hidden_size:                # DiT-B ablation body [enc, wide 2-block head]
    - 768
    - 1024
    depth:
    - 12
    - 2
    num_heads:
    - 12
    - 16
    mlp_ratio: 4.0
    base_model_depth: 4
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
dataset:
  target: imagenet
  type: hf
  data_dir: /mnt/localssd/imagenet-256
  split: train
  condition_type: label
  shared_tmpdir: ~/tmp
training:
  epochs: 40
  global_batch_size: 2048
  grad_accum_steps: 2
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 2
  sample_every: 5000
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.0002
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 6
    decay_end_epoch: 13
    base_lr: 0.0002
    final_lr: 0.0002   # == base_lr -> no decay, constant LR after warmup
    warmup_from_zero: false
  image_size: 256
eval: null
misc:
  latent_size:
  - 1024
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
