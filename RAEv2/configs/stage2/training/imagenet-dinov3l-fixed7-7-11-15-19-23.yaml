# Stage-2 DiT on a FIXED layer subset of our RAEv2.5 (random-drop, no-SIGReg) k=23
# decoder. The combine is a plain equal-weight MEAN over the chosen layers (no gate,
# no drop). Everything outside stage_1 is aligned with imagenet-dinov3l-k7.yaml
# (80 epochs, same DDT-XL, same schedule). run_dit_fixed7.sh substitutes the layers
# and the latent_stats path.
stage_1:
  target: stage1.RAECombine
  params:
    encoder_name: dinov3mls-vit-l16[layers=7.11.15.19.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    stage1_ckpt_path: output_full/decoder_random_drop_layer_mls_plain_k23/ckpt_latest.pt
    use_ema: true
    latent_dim: 1024
    normalization_stat_path: output_full/fixed7_7-11-15-19-23_latent_stats.pt
    drop: false
    combine_config:
      target: stage1.combine.MLSCombine
      params:
        layers: [7, 11, 15, 19, 23]
        weighting: mean
        p_drop: 0.0
        p_full: 0.0
        cls_surrogate: false
        projector: none
        dim: 1024
        out_dim: 1024
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size:
    - 1
    - 1
    in_channels: 1024
    hidden_size:
    - 1440
    - 2048
    depth:
    - 28
    - 2
    num_heads:
    - 20
    - 16
    mlp_ratio: 4.0
    base_model_depth: 8
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
dataset:
  target: imagenet
  type: hf
  data_dir: /sensei-fs-3/users/yunfeix/datasets_backup/imagenet-256-full
  split: train
  condition_type: label
  shared_tmpdir: ~/tmp
training:
  epochs: 80
  global_batch_size: 1024
  grad_accum_steps: 8   # 4-GPU: 1024/(4*8)=32 micro/GPU (64 OOM'd on 80GB H100), global batch unchanged
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 1
  sample_every: 5000
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.002             # 10x the k7 baseline (0.0002)
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 25
    decay_end_epoch: 50
    base_lr: 0.002         # 10x the k7 baseline
    final_lr: 2.0e-04      # 10x the k7 baseline
    warmup_from_zero: false
  image_size: 256
misc:
  latent_size:
  - 1024
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
