# Stage-2 DiT-B on the omni-randomdrop-plain-k7-nano-p0.3 decoder (RAECombine, drop=true).
#
# stage_1 = RAECombine wrapping the k7 random-drop-plain decoder (ema_combine + ema_dec)
#   downloaded from s3://hongyangd-raev2-backup/ckpt/omni-randomdrop-plain-k7-nano-p0.3/.
#   The decoder already owns the subset-reconstruction landscape (train p_drop=0.3,
#   cls_surrogate=true); with drop=true here the DiT trains on the SAME per-sample
#   random-LAYER-drop latent distribution -> it learns the diffusion landscape over the
#   layer subsets. No feature-fusion network is used (projector=none).
#
#   normalization_stat_path is the MARGINAL latent stat computed UNDER drop=true (see
#   run_dit_omni_randomdrop_k7_ditb.sh step 1): cls_surrogate + the drop-induced extra
#   variance are both folded into that single per-channel [1,C,1,1] mean/var, so the DiT
#   target is ~unit-variance over the actual training distribution.
#
# stage_2 = DiT-B body [768,1024] depth [12,2] heads [12,16] base_model_depth 4 (same
#   budget/schedule as the abl-dit-b-* decoder ablation).
stage_1:
  target: stage1.RAECombine
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    stage1_ckpt_path: /sensei-fs-3/users/hongyangd/ckpt/omni-randomdrop-plain-k7-nano-p0.3/ckpt_latest.pt
    use_ema: true
    latent_dim: 1024
    normalization_stat_path: /sensei-fs-3/users/hongyangd/ckpt/omni-randomdrop-plain-k7-nano-p0.3/latent_stats.pt
    drop: true
    combine_config:
      target: stage1.combine.MLSCombine
      params:
        layers: [11, 13, 15, 17, 19, 21, 23]
        weighting: random_drop
        p_drop: 0.3
        p_full: 0.0
        cls_surrogate: true
        projector: none
        dim: 1024
        out_dim: 1024
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size:
    - 1
    - 1
    in_channels: 1024
    hidden_size:                # DiT-B body [enc, wide 2-block head]
    - 768
    - 1024
    depth:
    - 12
    - 2
    num_heads:
    - 12
    - 16
    mlp_ratio: 4.0
    base_model_depth: 4
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
dataset:
  target: imagenet
  type: hf
  data_dir: /mnt/localssd/imagenet-256
  split: train
  condition_type: label
  shared_tmpdir: ~/tmp
training:
  epochs: 80
  global_batch_size: 2048
  grad_accum_steps: 1
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 2
  sample_every: 5000
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.0002
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 6           # warmup only; NO decay (final_lr == base_lr -> constant 2e-4)
    decay_end_epoch: 13        # irrelevant while final_lr == base_lr
    base_lr: 0.0002
    final_lr: 0.0002           # no LR decay: hold base_lr for the whole 80ep run
    warmup_from_zero: false
  image_size: 256
misc:
  latent_size:
  - 1024
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
