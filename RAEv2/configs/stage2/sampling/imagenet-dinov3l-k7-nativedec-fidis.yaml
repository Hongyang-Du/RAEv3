# NATIVE eval: official k7 DiT latents decoded by the OFFICIAL k7 decoder.
# Same pipeline as the reference imagenet-dinov3l-k7.yaml, but the eval block is
# switched to fid + inception_score against the official 50k val npz (torch-fidelity
# fast path, no fd_evaluator needed) so it is directly comparable to the
# cross-decoder eval (imagenet-dinov3l-k7-crossdec-omni.yaml).
stage_1:
  target: stage1.RAE
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    pretrained_decoder_path: pretrained_models/stage1/imagenet/dinov3l-k7/decoder.pt
    noise_tau: 0.0
    normalization_stat_path: pretrained_models/stage1/imagenet/dinov3l-k7/stats.pt
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size: [1, 1]
    in_channels: 1024
    hidden_size: [1440, 2048]
    depth: [28, 2]
    num_heads: [20, 16]
    mlp_ratio: 4.0
    base_model_depth: 8
  ckpt: pretrained_models/stage2/imagenet/dinov3l-k7/checkpoint.pt
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
  ig:
    scale: 1.78
    t_min: 0.10
    t_max: 1.0
dataset:
  target: imagenet
  type: hf
  data_dir: /mnt/localssd/imagenet-256
  split: train
  condition_type: label
  shared_tmpdir: /tmp/gfid_shards
training:
  global_batch_size: 1024
  grad_accum_steps: 1
  num_workers: 4
  global_seed: 42
  image_size: 256
eval:
  eval_dir: results/stage2/eval
  eval_model: false
  datasets:
    imagenet:
      type: hf
      data_dir: /sensei-fs-3/users/hongyangd/official_raev2/data/imagenet-256
      split: val
      condition_type: label
      num_samples: 50000
      reference_npz: null
      metrics:
      - fid
      - inception_score
misc:
  latent_size: [1024, 16, 16]
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
